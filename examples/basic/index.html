<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraMapKit · 基础地图示例</title>
  </head>
  <body>
    <header>
      <div><strong>TerraMapKit</strong><span>地图、图层、掩膜与 Entity 特效 · 无需 Token</span></div>
      <nav aria-label="地图操作">
        <button id="reset" type="button">重建地图</button>
        <button id="destroy" type="button">销毁地图</button>
      </nav>
    </header>
    <section class="tools" aria-label="工具包操作">
      <button id="layer-add" type="button">添加图层</button>
      <button id="layer-toggle" type="button">切换图层显隐</button>
      <label>图层透明度 <input id="alpha" type="range" min="0" max="1" step="0.1" value="0.6" /></label>
      <button id="layer-remove" type="button">移除图层</button>
      <button id="mask-add" type="button">添加掩膜</button>
      <button id="mask-update" type="button">更新掩膜</button>
      <button id="mask-remove" type="button">移除掩膜</button>
      <button id="tilt" type="button">倾斜视角</button>
      <button id="terrain" type="button">切换合成地形</button>
    </section>
    <section class="tools" aria-label="特效操作">
      <button id="effect-ripple" type="button">波纹圈</button>
      <button id="effect-diffusion" type="button">扩散圈</button>
      <button id="effect-wave" type="button">波形线</button>
      <button id="effect-update" type="button">更新特效</button>
      <button id="effect-pause" type="button">暂停／恢复特效</button>
      <button id="effect-remove" type="button">清除特效</button>
    </section>
    <details class="kit-panel" open>
      <summary>拾取 · 绘制 · 测量 · 镜头 · 弹窗 · 模型 · 轨迹</summary>
      <section class="tools" aria-label="绘制测量操作">
        <select id="tool-kind" aria-label="交互类型">
          <option value="pick">点击拾取</option><option value="draw-point">绘制点</option><option value="draw-polyline">绘制线</option><option value="draw-polygon">绘制面</option>
          <option value="measure-distance">测距离</option><option value="measure-area">测面积</option><option value="measure-height">测高差</option>
        </select>
        <button id="tool-start">开始交互</button><button id="tool-undo">撤销点</button><button id="tool-finish">完成绘制</button><button id="tool-cancel">取消交互</button><button id="tool-clear">清除绘制测量</button><button id="tool-demo">生成绘制测量演示</button>
      </section>
      <section class="tools" aria-label="镜头弹窗操作">
        <button id="camera-save">保存视角</button><button id="camera-restore">恢复视角</button><button id="camera-orbit">环绕镜头</button><button id="camera-stop">停止环绕</button><button id="popup-show">显示弹窗</button><button id="popup-remove">关闭弹窗</button>
      </section>
      <section class="tools" aria-label="模型轨迹操作">
        <button id="tiles-add">加载离线模型</button><button id="tiles-style">模型样式</button><button id="tiles-toggle">模型显隐</button><button id="tiles-remove">移除模型</button>
        <button id="track-add">播放轨迹</button><button id="track-pause">暂停／恢复轨迹</button><button id="track-seek">跳至 10 秒</button><button id="track-speed">2 倍速</button><button id="track-remove">清除轨迹</button>
      </section>
    </details>
    <main id="map" aria-label="Cesium 三维地球"></main>
    <aside aria-live="polite">
      <p id="status">正在初始化地图…</p>
      <p id="checks"></p>
    </aside>
    <script type="module" src="/main.js"></script>
  </body>
</html>
